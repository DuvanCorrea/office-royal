spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/officewars}
    username: ${SPRING_DATASOURCE_USERNAME:officewars}
    password: ${SPRING_DATASOURCE_PASSWORD:officewars}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: false

server:
  port: 8080

logging:
  level:
    com.officewars: INFO
